name: Build MashaPoster.exe (.NET 10 Framework-Dependent)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # позволяет нажимать "Run workflow" вручную

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single File EXE (Framework-Dependent)
        shell: pwsh
        run: |
          # Флаг --self-contained false убирает ядро .NET из сборки, делая файл легким (~5-10 МБ)
          dotnet publish MashaPoster.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o output
          
          # Копируем итоговый файл в корень для загрузки
          Copy-Item "output\MashaPoster.exe" "MashaPoster.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MashaPoster
          path: MashaPoster.exe

      - name: Attach exe to release (only when you push a tag like v1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MashaPoster.exe
