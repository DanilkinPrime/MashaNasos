name: Build MashaPoster.exe

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # позволяет нажимать "Run workflow" вручную

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild / Roslyn (Modern CSC)
        uses: microsoft/setup-msbuild@v2

      - name: Compile with C# compiler
        shell: pwsh
        run: |
          # Используем актуальный csc.exe из установленной Visual Studio (поддерживает последние стандарты)
          $csc = "csc.exe"
          
          # Компилируем основной код (Program.cs) И файл настроек (Properties\Settings.Designer.cs)
          # Также обязательно добавляем ссылку /r:System.Configuration.dll для работы Properties.Settings
          & $csc /nologo /target:winexe /out:MashaPoster.exe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Configuration.dll /r:System.dll `
            /resource:poster.jpg,poster.jpg /resource:daddy.png,daddy.png `
            Program.cs Properties\Settings.Designer.cs
            
          if (-not (Test-Path MashaPoster.exe)) { throw "Build failed" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MashaPoster
          path: MashaPoster.exe

      - name: Attach exe to release (only when you push a tag like v1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MashaPoster.exe
